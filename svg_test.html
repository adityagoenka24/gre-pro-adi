<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
body{background:#0a0a0f;padding:40px;font-family:sans-serif;color:#ccc;}
.pq-figure{display:flex;justify-content:center;margin-bottom:20px;padding:16px;background:#1a1a2e;border-radius:8px;border:1px solid #333;}
.pq-figure svg{max-width:100%;height:auto;display:block;}
.card{background:#111;padding:24px;border-radius:8px;max-width:500px;margin:0 auto;}
h3{color:#6c63ff;}
</style></head>
<body>
<h3>SVG Rendering Test — GEO-PYT-001</h3>
<div class="card">
  <div id="figure-static">
    <p style="color:#aaa;font-size:12px;">Static injection:</p>
    <div class="pq-figure"><svg viewBox='0 0 210 170' xmlns='http://www.w3.org/2000/svg' style='font-family:sans-serif;'><polygon points='77.0,140 35,140 35,84.0' fill='none' stroke='#ccc' stroke-width='2'/><polyline points='44,140 44,131 35,131' fill='none' stroke='#888' stroke-width='1.5'/><text x='81' y='144' font-size='12' fill='#aaa' font-weight='600'>A</text><text x='19' y='144' font-size='12' fill='#aaa' font-weight='600'>C</text><text x='19' y='84' font-size='12' fill='#aaa' font-weight='600'>B</text><text x='56' y='154' font-size='11' fill='#6c63ff'>3</text><text x='13' y='112' font-size='11' fill='#6c63ff'>4</text><text x='62' y='112' font-size='11' fill='#f7971e'>5</text></svg></div>
  </div>
  <hr style="border-color:#333;margin:20px 0;">
  <div id="figure-dynamic"></div>
  <p style="font-size:15px;line-height:1.7;">A right triangle has legs of length 3 and 4. What is the length of the hypotenuse?</p>
</div>
<script>
// Simulate exactly what the app does
const svg = "<svg viewBox='0 0 210 170' xmlns='http://www.w3.org/2000/svg' style='font-family:sans-serif;'><polygon points='77.0,140 35,140 35,84.0' fill='none' stroke='#ccc' stroke-width='2'/><polyline points='44,140 44,131 35,131' fill='none' stroke='#888' stroke-width='1.5'/><text x='81' y='144' font-size='12' fill='#aaa' font-weight='600'>A</text><text x='19' y='144' font-size='12' fill='#aaa' font-weight='600'>C</text><text x='19' y='84' font-size='12' fill='#aaa' font-weight='600'>B</text><text x='56' y='154' font-size='11' fill='#6c63ff'>3</text><text x='13' y='112' font-size='11' fill='#6c63ff'>4</text><text x='62' y='112' font-size='11' fill='#f7971e'>5</text></svg>";
const el = document.getElementById("figure-dynamic");
el.innerHTML = "<p style='color:#aaa;font-size:12px;'>Dynamic innerHTML injection:</p><div class='pq-figure'>" + svg + "</div>";
</script>
</body></html>
